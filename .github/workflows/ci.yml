name: CI

on:
  pull_request:
    branches: ["master", "develop"]
  push:
    branches: ["master", "develop"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp example.env .env

      - name: Build app image
        run: docker compose build app

      - name: Start dependencies
        run: docker compose up -d postgres localstack

      - name: Run lint
        run: docker compose run --rm --no-deps app ruff check --config .github/ruff.toml Core common apps manage.py

      - name: Run tests
        run: docker compose run --rm --no-deps app python manage.py test

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
