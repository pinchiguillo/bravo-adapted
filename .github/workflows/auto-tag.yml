name: Auto Tag

on:
  push:
    branches: ["master", "develop"]

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag
        id: compute
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"

          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION value: $VERSION_VALUE"
            exit 1
          fi

          LATEST_STABLE_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"

          if [[ -n "$LATEST_STABLE_TAG" ]]; then
            BASE_VERSION="${LATEST_STABLE_TAG#v}"
          else
            BASE_VERSION="$VERSION_VALUE"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_STABLE="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          if [[ "$BRANCH" == "master" ]]; then
            NEW_TAG="v${NEXT_STABLE}"
          else
            NEW_TAG="v${NEXT_STABLE}-dev.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          fi

          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.compute.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.compute.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Auto tag for ${GITHUB_REF_NAME} (${GITHUB_SHA})"

      - name: Push tag
        if: steps.compute.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${{ steps.compute.outputs.tag }}"
