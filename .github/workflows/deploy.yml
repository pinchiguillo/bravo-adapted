name: Docker CI/CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-dev.*"

permissions:
  contents: read

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  pr-build:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: local/pr-check:${{ github.event.workflow_run.head_sha }}

  publish-dev:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolver tags dev
        id: meta
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          WORKFLOW_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${WORKFLOW_SHA::7}"
          IMAGE_TAG="${VERSION}-dev.${{ github.event.workflow_run.run_number }}-${SHORT_SHA}"

          {
            echo "all_tags<<EOF"
            echo "${IMAGE_NAME}:${IMAGE_TAG}"
            echo "${IMAGE_NAME}:dev"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login al registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build y push dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.all_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-prod:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-dev.') }}
    runs-on: ubuntu-latest
    # Opcional:
    # environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Resolver tags prod
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          {
            echo "all_tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            echo "${IMAGE_NAME}:prod"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login al registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build y push prod
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.all_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
