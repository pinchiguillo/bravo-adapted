name: Docker CI/CD

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop" ]
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  pr-build:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: local/pr-check:${{ github.sha }}

  publish-dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolver tags dev
        id: meta
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${VERSION}-dev.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          {
            echo "all_tags<<EOF"
            echo "${IMAGE_NAME}:${IMAGE_TAG}"
            echo "${IMAGE_NAME}:dev"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login al registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build y push dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.all_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-prod:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Opcional:
    # environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Resolver tags prod
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          {
            echo "all_tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            echo "${IMAGE_NAME}:prod"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login al registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build y push prod
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.all_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
