            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Validates the verification token and marks the user's email as
        verified.
      summary: Verify email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
