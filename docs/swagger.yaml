  /api/organizations/{organization_uuid}/announcements/:
    get:
      operationId: organizations_announcements_list
      description: Lists announcements for the organization specified in the URL.
        Supports optional filtering by title, category, service, status, text fields,
        coordinates presence and plain text search.
      summary: List announcements
      parameters:
      - in: query
        name: categories
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Optional list of category UUIDs used to filter announcements.
        explode: true
        style: form
      - in: query
        name: category
        schema:
          type: string
        description: Single category UUID filter kept for backwards compatibility.
      - in: query
        name: description
        schema:
          type: string
        description: Optional text used to filter announcements by description.
      - in: query
        name: free_text
        schema:
          type: string
        description: Optional text used to filter announcements by free text.
      - in: query
        name: has_coordinates
        schema:
          type: boolean
        description: Optional boolean filter to include only announcements with or
          without coordinates.
      - in: query
        name: location
        schema:
          type: string
        description: Optional text used to filter announcements by location.
      - in: query
        name: name
        schema:
          type: string
        description: Optional text used to filter announcements by name.
      - in: path
        name: organization_uuid
        schema:
          type: string
        description: UUID of the organization that owns the nested resource.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Optional text used to filter announcements by their visible text
          fields.
      - in: query
        name: service
        schema:
          type: string
        description: Single service catalog UUID filter.
      - in: query
        name: services
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Optional list of service catalog UUIDs used to filter announcements.
        explode: true
        style: form
      - in: query
        name: status
        schema:
          type: string
        description: Single announcement status filter.
      - in: query
        name: statuses
        schema:
          type: array
          items:
            type: string
        description: Optional list of announcement statuses used to filter announcements.
        explode: true
        style: form
      - in: query
        name: title
        schema:
          type: string
        description: Optional text used to filter announcements by title.
      - in: query
        name: uuid
        schema:
          type: string
        description: Single announcement UUID filter.
