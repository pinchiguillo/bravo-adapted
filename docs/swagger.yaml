components:
  schemas:
    Category:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
      required:
      - name
      - uuid
    EmailTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
          readOnly: true
        organization:
          type: integer
        plan_price:
          type: integer
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organization
      - plan_price
      - updated_at
      - user
      - uuid
    JobStatusEnum:
      enum:
      - pending
      - active
      - completed
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `active` - Active
        * `completed` - Completed
        * `rejected` - Rejected
    Organization:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
        tax_id:
          type: string
          maxLength: 64
        billing_email:
          type: string
          format: email
          maxLength: 254
        billing_address:
          type: string
          maxLength: 255
        billing_city:
          type: string
          maxLength: 120
        billing_country:
          type: string
          maxLength: 2
        billing_postal_code:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - billing_address
      - billing_city
      - billing_country
      - billing_email
      - billing_postal_code
      - created_at
      - legal_name
      - name
      - tax_id
      - updated_at
      - uuid
    PatchedJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
          readOnly: true
        organization:
          type: integer
        plan_price:
          type: integer
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedOrganization:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
        tax_id:
          type: string
          maxLength: 64
        billing_email:
          type: string
          format: email
          maxLength: 254
        billing_address:
          type: string
          maxLength: 255
        billing_city:
          type: string
          maxLength: 120
        billing_country:
          type: string
          maxLength: 2
        billing_postal_code:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedService:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedServicePrice:
      type: object
      properties:
        service:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          default: EUR
          maxLength: 3
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSubservice:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        service:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
      - username
    Service:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - name
      - organization
      - updated_at
      - uuid
    ServicePrice:
      type: object
      properties:
        service:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          default: EUR
          maxLength: 3
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - effective_from
      - service
      - updated_at
    Subservice:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        service:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - name
      - service
      - updated_at
      - uuid
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        email_verified:
          type: boolean
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        status:
          $ref: '#/components/schemas/UserStatusEnum'
      required:
      - email
      - id
      - username
      - uuid
    UserStatusEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    VerifyEmail:
      type: object
      properties:
        token:
          type: string
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
