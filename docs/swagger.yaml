components:
  schemas:
    AccountStatusEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    Announcement:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        services:
          type: array
          items:
            type: string
            format: uuid
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        announcement:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/AnnouncementStatusEnum'
        description:
          type: string
        free_text:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        view_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - announcement
      - category
      - created_at
      - location
      - name
      - organization
      - updated_at
      - uuid
      - view_count
    AnnouncementStatusEnum:
      enum:
      - closed
      - suspended
      - active
      type: string
      description: |-
        * `closed` - Closed
        * `suspended` - Suspended
        * `active` - Active
    Category:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
      required:
      - name
      - uuid
    ChargingTypeEnum:
      enum:
      - per_day
      - per_hour
      - per_square_meter
      - per_project
      type: string
      description: |-
        * `per_day` - Per day
        * `per_hour` - Per hour
        * `per_square_meter` - Per square meter
        * `per_project` - Per project
    EmailTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
          readOnly: true
        announcement:
          type: integer
        plan_price:
          type: integer
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        organization_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - announcement
      - created_at
      - id
      - plan_price
      - updated_at
      - user
      - uuid
    JobChat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        job:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - job
      - updated_at
      - uuid
    JobStatusEnum:
      enum:
      - pending
      - active
      - inactive
      - suspended
      - completed
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
        * `completed` - Completed
        * `rejected` - Rejected
    ManagementFeatureFlag:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - key
      - name
      - updated_at
      - uuid
    ManagementJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        announcement:
          type: string
          format: uuid
        plan_price:
          type: integer
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        organization_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - announcement
      - created_at
      - id
      - plan_price
      - updated_at
      - user
      - uuid
    ManagementOrganization:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
        tax_id:
          type: string
          maxLength: 64
        billing_email:
          type: string
          format: email
          maxLength: 254
        billing_address:
          type: string
          maxLength: 255
        billing_city:
          type: string
          maxLength: 120
        billing_country:
          type: string
          maxLength: 2
        billing_postal_code:
          type: string
          maxLength: 20
        verification_level:
          type: integer
          maximum: 2147483647
          minimum: 0
        rating:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AccountStatusEnum'
