components:
  schemas:
    AccountStatusEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    AllowedCity:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
      required:
      - name
      - uuid
    Announcement:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/AnnouncementImage'
          readOnly: true
        lowest_price:
          type: string
          nullable: true
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          readOnly: true
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        title:
          type: string
        status:
          $ref: '#/components/schemas/AnnouncementStatusEnum'
        description:
          type: string
        free_text:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        view_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - description
      - free_text
      - images
      - location
      - lowest_price
      - name
      - organization
      - services
      - title
      - updated_at
      - uuid
      - view_count
    AnnouncementImage:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        image:
          type: string
          format: uri
          writeOnly: true
        image_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        filename:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - filename
      - image
      - image_url
      - uuid
    AnnouncementStatusEnum:
      enum:
      - closed
      - suspended
      - active
      type: string
      description: |-
        * `closed` - Closed
        * `suspended` - Suspended
        * `active` - Active
    Category:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
      required:
      - name
      - uuid
    ChargingTypeEnum:
      enum:
