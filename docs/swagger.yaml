openapi: 3.0.3
info:
  title: Bravo API
  version: 0.0.8
  description: OpenAPI documentation for the Bravo backend.
paths:
  /api/allowed-cities/:
    get:
      operationId: allowed_cities_list
      description: Returns the public allowed cities catalog.
      summary: List allowed cities
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAllowedCityList'
          description: ''
  /api/announcements/:
    get:
      operationId: announcements_list
      description: Lists active announcements. Supports optional filtering by title,
        organization, category, service, text fields, coordinates presence and plain
        text search.
      summary: List public announcements
      parameters:
      - in: query
        name: categories
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Optional list of category UUIDs used to filter announcements.
        explode: true
        style: form
      - in: query
        name: category
        schema:
          type: string
        description: Single category UUID filter kept for backwards compatibility.
      - in: query
        name: description
        schema:
          type: string
        description: Optional text used to filter announcements by description.
      - in: query
        name: free_text
        schema:
          type: string
        description: Optional text used to filter announcements by free text.
      - in: query
        name: has_coordinates
        schema:
          type: boolean
        description: Optional boolean filter to include only announcements with or
          without coordinates.
      - in: query
        name: location
        schema:
          type: string
        description: Optional text used to filter announcements by location.
      - in: query
        name: name
        schema:
          type: string
        description: Optional text used to filter announcements by name.
      - in: query
        name: organization
        schema:
          type: string
        description: Single organization UUID filter.
      - in: query
        name: organizations
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Optional list of organization UUIDs used to filter announcements.
        explode: true
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Optional text used to filter announcements by their visible text
          fields.
      - in: query
        name: service
        schema:
          type: string
        description: Single service catalog UUID filter.
      - in: query
        name: services
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Optional list of service catalog UUIDs used to filter announcements.
        explode: true
        style: form
      - in: query
        name: title
        schema:
          type: string
        description: Optional text used to filter announcements by title.
      - in: query
        name: uuid
        schema:
          type: string
        description: Single announcement UUID filter.
      tags:
      - Announcements
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
  /api/announcements/{announcement_uuid}/subservices/:
    get:
      operationId: announcements_subservices_list
      description: Lists the subservices of the announcement specified in the URL.
      summary: List subservices
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Services
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubserviceList'
          description: ''
    post:
      operationId: announcements_subservices_create
      description: Creates a subservice associated with the announcement specified
        in the URL.
      summary: Create subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subservice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Subservice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Subservice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subservice'
          description: ''
  /api/announcements/{announcement_uuid}/subservices/{subservice_uuid}/:
    get:
      operationId: announcements_subservices_retrieve
      description: Returns the details of a subservice belonging to the announcement
        specified in the URL.
      summary: Get subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
