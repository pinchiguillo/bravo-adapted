openapi: 3.0.3
info:
  title: Bravo API
  version: 1.0.0
  description: Documentacion OpenAPI del backend Bravo.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Autentica al usuario con email y password y devuelve los tokens
        JWT de acceso y refresco.
      summary: Iniciar sesion
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Devuelve los datos del usuario autenticado a partir del token enviado
        en la peticion.
      summary: Obtener usuario autenticado
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Crea una nueva cuenta de usuario y devuelve el perfil registrado.
      summary: Registrar usuario
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Recibe un refresh token valido y devuelve un nuevo access token
        JWT.
      summary: Refrescar token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Valida el token de verificacion y marca el email del usuario como
        verificado.
      summary: Verificar email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmail'
          description: ''
  /api/jobs/:
    get:
      operationId: jobs_list
      description: Lista los trabajos donde el usuario autenticado participa como
        cliente o como organizacion.
      summary: Listar trabajos
      tags:
      - jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
          description: ''
    post:
      operationId: jobs_create
      description: Crea un nuevo trabajo asociado al usuario autenticado.
      summary: Crear trabajo
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{uuid}/:
    get:
      operationId: jobs_retrieve
      description: Devuelve el detalle de un trabajo accesible para el usuario autenticado.
      summary: Obtener trabajo
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    put:
      operationId: jobs_update
      description: Reemplaza completamente un trabajo accesible para el usuario autenticado.
      summary: Reemplazar trabajo
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    patch:
      operationId: jobs_partial_update
      description: Actualiza parcialmente un trabajo accesible para el usuario autenticado.
      summary: Actualizar trabajo
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJob'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    delete:
      operationId: jobs_destroy
      description: Elimina un trabajo accesible para el usuario autenticado.
      summary: Eliminar trabajo
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/jobs/{uuid}/messages/:
    get:
      operationId: jobs_messages_retrieve
      description: Obtiene los mensajes del chat del trabajo o crea un nuevo mensaje
        en ese chat.
      summary: Gestionar mensajes del trabajo
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    post:
      operationId: jobs_messages_create
      description: Obtiene los mensajes del chat del trabajo o crea un nuevo mensaje
        en ese chat.
      summary: Gestionar mensajes del trabajo
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{uuid}/messages/{message_id}/attachments/:
    post:
      operationId: jobs_messages_attachments_create
      description: Sube un archivo y lo vincula a un mensaje existente dentro del
        chat del trabajo.
      summary: Adjuntar archivo a mensaje
      parameters:
      - in: path
        name: message_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/organization/:
    get:
      operationId: organization_list
      description: Lista todas las organizaciones. Solo disponible para usuarios administradores.
      summary: Listar organizaciones
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
  /api/organization/{organization_uuid}/services/:
    get:
      operationId: organization_services_list
      description: Lista los servicios de la organizacion indicada en la URL.
      summary: Listar servicios
      parameters:
      - in: path
        name: organization_uuid
        schema:
          type: string
        description: UUID de la organizacion propietaria del servicio.
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
          description: ''
    post:
      operationId: organization_services_create
      description: Crea un servicio dentro de la organizacion indicada en la URL si
        pertenece al usuario autenticado.
      summary: Crear servicio
      parameters:
      - in: path
        name: organization_uuid
        schema:
          type: string
        description: UUID de la organizacion propietaria del servicio.
        required: true
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Service'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Service'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Service'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
  /api/organization/{organization_uuid}/services/{uuid}/:
    get:
      operationId: organization_services_retrieve
      description: Devuelve el detalle de un servicio perteneciente a la organizacion
        indicada en la URL.
      summary: Obtener servicio
      parameters:
      - in: path
        name: organization_uuid
        schema:
          type: string
        description: UUID de la organizacion propietaria del servicio.
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
    put:
      operationId: organization_services_update
      description: Reemplaza completamente un servicio de la organizacion indicada
        en la URL.
      summary: Reemplazar servicio
      parameters:
      - in: path
        name: organization_uuid
        schema:
          type: string
        description: UUID de la organizacion propietaria del servicio.
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Service'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Service'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Service'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
    patch:
      operationId: organization_services_partial_update
      description: Actualiza parcialmente un servicio de la organizacion indicada
        en la URL.
      summary: Actualizar servicio
      parameters:
      - in: path
        name: organization_uuid
        schema:
          type: string
        description: UUID de la organizacion propietaria del servicio.
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedService'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedService'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedService'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
    delete:
      operationId: organization_services_destroy
      description: Elimina un servicio de la organizacion indicada en la URL.
      summary: Eliminar servicio
      parameters:
      - in: path
        name: organization_uuid
        schema:
          type: string
        description: UUID de la organizacion propietaria del servicio.
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/organization/{uuid}/:
    get:
      operationId: organization_retrieve
      description: Devuelve el detalle publico de una organizacion identificada por
        su UUID.
      summary: Obtener organizacion
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    put:
      operationId: organization_update
      description: Reemplaza completamente una organizacion. Solo permitido a su propietario
        autenticado.
      summary: Reemplazar organizacion
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Organization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    patch:
      operationId: organization_partial_update
      description: Actualiza parcialmente una organizacion. Solo permitido a su propietario
        autenticado.
      summary: Actualizar organizacion
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    delete:
      operationId: organization_destroy
      description: Elimina una organizacion. Solo permitido a su propietario autenticado.
      summary: Eliminar organizacion
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/organization/categories/:
    get:
      operationId: organization_categories_list
      description: Devuelve el catalogo de categorias disponible para usuarios autenticados.
      summary: Listar categorias
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/organization/categories/{uuid}/:
    get:
      operationId: organization_categories_retrieve
      description: Devuelve el detalle de una categoria identificada por su UUID.
      summary: Obtener categoria
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/organization/me/:
    get:
      operationId: organization_me_retrieve
      description: Devuelve la organizacion asociada al usuario autenticado.
      summary: Obtener mi organizacion
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    patch:
      operationId: organization_me_partial_update
      description: Actualiza parcialmente la organizacion asociada al usuario autenticado.
      summary: Actualizar mi organizacion
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/organization/service-prices/:
    get:
      operationId: organization_service_prices_list
      description: Lista los precios configurados para servicios de la organizacion
        del usuario autenticado.
      summary: Listar precios de servicio
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePrice'
          description: ''
    post:
      operationId: organization_service_prices_create
      description: Crea un precio para un servicio de la organizacion del usuario
        autenticado.
      summary: Crear precio de servicio
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicePrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicePrice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrice'
          description: ''
  /api/organization/service-prices/{uuid}/:
    get:
      operationId: organization_service_prices_retrieve
      description: Devuelve el detalle de un precio de servicio accesible por el usuario
        autenticado.
      summary: Obtener precio de servicio
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
        description: Identificador del precio de servicio.
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrice'
          description: ''
    put:
      operationId: organization_service_prices_update
      description: Reemplaza completamente un precio de servicio de la organizacion
        del usuario autenticado.
      summary: Reemplazar precio de servicio
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
        description: Identificador del precio de servicio.
        required: true
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicePrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicePrice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrice'
          description: ''
    patch:
      operationId: organization_service_prices_partial_update
      description: Actualiza parcialmente un precio de servicio de la organizacion
        del usuario autenticado.
      summary: Actualizar precio de servicio
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
        description: Identificador del precio de servicio.
        required: true
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServicePrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServicePrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServicePrice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrice'
          description: ''
    delete:
      operationId: organization_service_prices_destroy
      description: Elimina un precio de servicio de la organizacion del usuario autenticado.
      summary: Eliminar precio de servicio
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
        description: Identificador del precio de servicio.
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/organization/services/{service_uuid}/subservices/:
    get:
      operationId: organization_services_subservices_list
      description: Lista los subservicios del servicio indicado en la URL.
      summary: Listar subservicios
      parameters:
      - in: path
        name: service_uuid
        schema:
          type: string
        description: UUID del servicio propietario del subservicio.
        required: true
      tags:
      - organization
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subservice'
          description: ''
    post:
      operationId: organization_services_subservices_create
