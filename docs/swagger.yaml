      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobChat'
          description: ''
  /api/jobs/chats/{uuid}/messages/{message_id}/attachments/:
    post:
      operationId: jobs_chats_messages_attachments_create
      description: Uploads a file and links it to an existing message in the selected
        chat.
      summary: Attach file to message
      parameters:
      - in: path
        name: message_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobChat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobChat'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobChat'
          description: ''
  /api/jobs/chats/{uuid}/messages/{message_id}/attachments/{attachment_id}/download/:
    get:
      operationId: jobs_chats_messages_attachments_download_retrieve
      description: Returns a temporary signed URL to download the chat attachment
        if the authorized user still has access to the chat.
      summary: Get temporary attachment URL
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: message_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
