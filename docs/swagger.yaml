  /api/jobs/chats/{uuid}/messages/:
    get:
      operationId: jobs_chats_messages_retrieve
      description: Gets messages or creates a new message in the selected chat.
      summary: Manage chat messages
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobChat'
          description: ''
    post:
      operationId: jobs_chats_messages_create
      description: Gets messages or creates a new message in the selected chat.
      summary: Manage chat messages
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobChat'
          application/x-www-form-urlencoded:
            schema:
