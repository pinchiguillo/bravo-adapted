        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subservice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Subservice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Subservice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subservice'
          description: ''
    patch:
      operationId: announcements_subservices_partial_update
      description: Partially updates a subservice of the announcement specified in
        the URL.
      summary: Update subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubservice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSubservice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSubservice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subservice'
          description: ''
    delete:
      operationId: announcements_subservices_destroy
      description: Deletes a subservice of the announcement specified in the URL.
      summary: Delete subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
