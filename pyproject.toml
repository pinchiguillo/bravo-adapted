[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "BLE", "T20", "DJ", "UP", "SIM", "RUF"]
ignore = [
    "RUF012",  # Django/DRF declare configuration as mutable class attributes (Meta.fields, permission_classes...).
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101", "S105", "S106", "S108", "S311"]
"**/tests_*.py" = ["S101", "S105", "S106", "S108", "S311"]
"conftest.py" = ["S101"]
"apps/*/management/commands/*.py" = ["S311"]  # demo seed data, not security-sensitive randomness
"scripts/**" = ["S", "T20", "BLE", "B", "SIM105"]  # standalone smoke scripts that print and call external URLs

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Core.settings_test"
python_files = ["tests.py", "tests_*.py"]
testpaths = ["apps", "common", "Core"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["apps", "common", "Core"]
omit = ["*/migrations/*", "*/tests.py", "*/tests_*.py", "Core/settings_test.py", "Core/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
