[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "BLE", "T20", "DJ", "UP", "SIM", "RUF"]
ignore = [
    "RUF012",  # Django/DRF declare configuration as mutable class attributes (Meta.fields, permission_classes...).
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101", "S105", "S106", "S107", "S108", "S311"]
"**/tests_*.py" = ["S101", "S105", "S106", "S107", "S108", "S311"]
"conftest.py" = ["S101"]
"apps/*/management/commands/*.py" = ["S311"]  # demo seed data, not security-sensitive randomness
"scripts/**" = ["S", "T20", "BLE", "B", "SIM105"]  # standalone smoke scripts that print and call external URLs

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Core.settings_test"
python_files = ["tests.py", "tests_*.py"]
testpaths = ["apps", "common", "Core"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["apps", "common", "Core"]
omit = ["*/migrations/*", "*/tests.py", "*/tests_*.py", "Core/settings_test.py", "Core/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Typed core: shared utilities, the S3 upload pipeline and the chat, session
# and login services. The rest of the code base is checked progressively.
files = [
    "common",
    "apps/assets",
    "apps/auth/sessions.py",
    "apps/auth/login_guard.py",
    "apps/job_chat/services.py",
    "apps/job_chat/rate_limit.py",
]
exclude = ["/migrations/", "tests\\.py$", "tests_.*\\.py$"]
follow_imports = "silent"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["storages.*", "channels.*", "moto.*", "boto3.*", "botocore.*", "PIL.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "Core.settings_test"
