openapi: 3.0.3
info:
  title: Bravo API
  version: 0.0.10
  description: OpenAPI documentation for the Bravo backend.
paths:
  /api/{uuid}/:
    get:
      operationId: root_retrieve
      description: Returns the details of a specific job by UUID.
      summary: Get job details
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    put:
      operationId: root_update
      description: Updates a job's status or rating.
      summary: Update job
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
        '403':
          description: You don't have permission to update this job.
        '404':
          description: Job not found.
    patch:
      operationId: root_partial_update
      description: Partially updates a job's status or rating.
      summary: Partially update job
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
        '403':
          description: You don't have permission to update this job.
        '404':
          description: Job not found.
    delete:
      operationId: root_destroy
      description: Deletes a job.
      summary: Delete job
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Job deleted successfully.
        '403':
          description: You don't have permission to delete this job.
        '404':
          description: Job not found.
  /api/allowed-cities/:
    get:
      operationId: allowed_cities_list
      description: Returns the public allowed cities catalog.
      summary: List allowed cities
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAllowedCityList'
          description: ''
  /api/announcements/:
    get:
      operationId: announcements_list
      description: Lists active announcements. Supports optional filtering by title,
        organization, category, service, text fields, coordinates presence and plain
        text search.
      summary: List public announcements
      parameters:
      - in: query
        name: categories
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Optional list of category UUIDs used to filter announcements.
        explode: true
        style: form
      - in: query
        name: category
        schema:
          type: string
        description: Single category UUID filter kept for backwards compatibility.
      - in: query
        name: description
        schema:
          type: string
        description: Optional text used to filter announcements by description.
      - in: query
        name: free_text
        schema:
          type: string
        description: Optional text used to filter announcements by free text.
      - in: query
        name: has_coordinates
        schema:
          type: boolean
        description: Optional boolean filter to include only announcements with or
          without coordinates.
      - in: query
        name: location
        schema:
          type: string
        description: Optional text used to filter announcements by location.
      - in: query
        name: name
        schema:
          type: string
        description: Optional text used to filter announcements by name.
      - in: query
        name: organization
        schema:
          type: string
        description: Single organization UUID filter.
      - in: query
        name: organizations
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Optional list of organization UUIDs used to filter announcements.
        explode: true
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Optional text used to filter announcements by their visible text
          fields.
      - in: query
        name: service
        schema:
          type: string
        description: Single service catalog UUID filter.
      - in: query
        name: services
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Optional list of service catalog UUIDs used to filter announcements.
        explode: true
        style: form
      - in: query
        name: title
        schema:
          type: string
        description: Optional text used to filter announcements by title.
      - in: query
        name: uuid
        schema:
          type: string
        description: Single announcement UUID filter.
      tags:
      - Announcements
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
  /api/announcements/{announcement_uuid}/jobs/:
    post:
      operationId: announcements_jobs_create
      description: Creates a new job associated with the authenticated user for a
        specific announcement.
      summary: Create job for announcement
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
        '400':
          description: Invalid data provided.
        '404':
          description: Announcement not found.
  /api/announcements/{announcement_uuid}/subservices/:
    get:
      operationId: announcements_subservices_list
      description: Lists the subservices of the announcement specified in the URL.
      summary: List subservices
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Services
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubserviceList'
          description: ''
    post:
      operationId: announcements_subservices_create
      description: Creates a subservice associated with the announcement specified
        in the URL.
      summary: Create subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subservice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Subservice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Subservice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subservice'
          description: ''
  /api/announcements/{announcement_uuid}/subservices/{subservice_uuid}/:
    get:
      operationId: announcements_subservices_retrieve
      description: Returns the details of a subservice belonging to the announcement
        specified in the URL.
      summary: Get subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
        description: UUID of the subservice.
        required: true
      tags:
      - Services
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subservice'
          description: ''
    put:
      operationId: announcements_subservices_update
      description: Fully replaces a subservice of the announcement specified in the
        URL.
      summary: Replace subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subservice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Subservice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Subservice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subservice'
          description: ''
    patch:
      operationId: announcements_subservices_partial_update
      description: Partially updates a subservice of the announcement specified in
        the URL.
      summary: Update subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubservice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSubservice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSubservice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subservice'
          description: ''
    delete:
      operationId: announcements_subservices_destroy
      description: Deletes a subservice of the announcement specified in the URL.
      summary: Delete subservice
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Services
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/announcements/{announcement_uuid}/subservices/{subservice_uuid}/prices/:
    get:
      operationId: announcements_subservices_prices_list
      description: Lists the service prices of the subservice specified in the URL.
      summary: List service prices
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: subservice_uuid
        schema:
          type: string
        description: UUID of the subservice.
        required: true
      tags:
      - Services
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicePriceList'
          description: ''
    post:
      operationId: announcements_subservices_prices_create
      description: Creates a service price for the subservice specified in the URL.
      summary: Create service price
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
        description: UUID of the subservice.
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicePrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicePrice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrice'
          description: ''
  /api/announcements/{announcement_uuid}/subservices/{subservice_uuid}/prices/{price_uuid}/:
    get:
      operationId: announcements_subservices_prices_retrieve
      description: Returns a public service price belonging to the subservice specified
        in the URL.
      summary: Get service price
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: price_uuid
        schema:
          type: string
        description: Service price identifier.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
        description: UUID of the subservice.
        required: true
      tags:
      - Services
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrice'
          description: ''
    put:
      operationId: announcements_subservices_prices_update
      description: Fully replaces a service price belonging to the subservice specified
        in the URL.
      summary: Replace service price
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: price_uuid
        schema:
          type: string
        description: Service price identifier.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
        description: UUID of the subservice.
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicePrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicePrice'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrice'
          description: ''
    patch:
      operationId: announcements_subservices_prices_partial_update
      description: Partially updates a service price belonging to the subservice specified
        in the URL.
      summary: Update service price
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: price_uuid
        schema:
          type: string
        description: Service price identifier.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
        description: UUID of the subservice.
        required: true
      tags:
      - Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServicePrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServicePrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServicePrice'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrice'
          description: ''
    delete:
      operationId: announcements_subservices_prices_destroy
      description: Deletes a service price belonging to the subservice specified in
        the URL.
      summary: Delete service price
      parameters:
      - in: path
        name: announcement_uuid
        schema:
          type: string
        description: UUID of the announcement that owns the nested resource.
        required: true
      - in: path
        name: price_uuid
        schema:
          type: string
        description: Service price identifier.
        required: true
      - in: path
        name: subservice_uuid
        schema:
          type: string
        description: UUID of the subservice.
        required: true
      tags:
      - Services
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/announcements/{uuid}/:
    get:
      operationId: announcements_retrieve
      description: Returns the details of an active public announcement by announcement
        UUID.
      summary: Get public announcement
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
        description: UUID of the announcement.
        required: true
      tags:
      - Announcements
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/announcements/{uuid}/images/{image_uuid}/base64/:
    get:
      operationId: announcements_images_base64_retrieve
      description: Reads an image from the active public announcement and returns
        its content encoded as base64.
      summary: Get public announcement image as base64
      parameters:
      - in: path
        name: image_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: uuid
        schema:
          type: string
        description: UUID of the announcement.
        required: true
      tags:
      - Announcements
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementImageBase64'
          description: ''
  /api/assets/{asset_id}/complete/:
    post:
      operationId: assets_complete_create
      description: Confirms that the file has been uploaded to S3. Validates size,
        content type and file integrity, then moves it to its final location and marks
        the asset as CONFIRMED. No request body required.
      summary: Complete file upload
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Assets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
        '400':
          description: Validation failed.
        '404':
          description: Asset not found.
  /api/assets/initiate-upload/:
    post:
      operationId: assets_initiate_upload_create
      description: Validates file metadata and returns a presigned S3 PUT URL for
        direct client-to-S3 upload. After uploading the file to S3, call the *complete_url*
        to confirm and finalize the asset.
      summary: Initiate file upload
      tags:
      - Assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInitiateUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetInitiateUpload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetInitiateUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUploadTarget'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates the user with email and password and returns JWT
        access and refresh tokens.
      summary: Login
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns the authenticated user's data based on the token sent in
        the request.
      summary: Get authenticated user
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates a new user account. When email verification is bypassed,
        the response also includes JWT tokens.
      summary: Register user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Receives a valid refresh token and returns a new JWT access token.
      summary: Refresh token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Validates the verification token, marks the user's email as verified
        and returns JWT tokens.
      summary: Verify email
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmail'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: Returns the public categories catalog.
      summary: List categories
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
  /api/jobs/{job_uuid}/messages/:
    get:
      operationId: jobs_messages_retrieve
      description: Retrieve all messages for a job chat. Requires being the job owner
        or staff.
      summary: Get job chat messages
      parameters:
      - in: path
        name: job_uuid
