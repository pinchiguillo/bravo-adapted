        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
        announcement:
          type: integer
        announcement_details:
          allOf:
          - $ref: '#/components/schemas/Announcement'
          readOnly: true
        plan_price:
          type: integer
          nullable: true
        status:
