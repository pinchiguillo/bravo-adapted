components:
  schemas:
    ActiveStateStatusEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    AllowedCity:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
      required:
      - name
      - uuid
    Announcement:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        subservices:
          type: array
          items:
            $ref: '#/components/schemas/AnnouncementSubserviceWrite'
          writeOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/AnnouncementImage'
          readOnly: true
        lowest_price:
          type: string
          nullable: true
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          readOnly: true
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        title:
          type: string
        status:
          $ref: '#/components/schemas/AnnouncementStatusEnum'
        description:
          type: string
        free_text:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        view_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - description
      - free_text
      - images
      - location
      - lowest_price
      - name
      - organization
      - services
      - title
      - updated_at
      - uuid
      - view_count
    AnnouncementImage:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        image:
          type: string
          format: uri
          writeOnly: true
        image_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        base64_url:
          type: string
          format: uri
          readOnly: true
        filename:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - base64_url
      - created_at
      - filename
      - image
      - image_url
      - uuid
    AnnouncementImageBase64:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        filename:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        data:
          type: string
          readOnly: true
      required:
      - content_type
      - data
      - filename
      - uuid
    AnnouncementImageUploadRequest:
      type: object
      properties:
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 100
        size_bytes:
          type: integer
          minimum: 1
      required:
      - content_type
      - filename
      - size_bytes
    AnnouncementImageUploadTarget:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
          readOnly: true
        upload_method:
          type: string
          readOnly: true
        upload_headers:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        expires_in:
          type: integer
          readOnly: true
        upload_token:
          type: string
          readOnly: true
        complete_url:
          type: string
          format: uri
          readOnly: true
      required:
      - complete_url
      - expires_in
      - upload_headers
      - upload_method
      - upload_token
      - upload_url
    AnnouncementStatusEnum:
      enum:
      - closed
      - suspended
      - active
      type: string
      description: |-
        * `closed` - Closed
        * `suspended` - Suspended
        * `active` - Active
    AnnouncementSubserviceWrite:
      type: object
      properties:
        service_catalog:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        description:
          type: string
        prices:
          type: array
          items:
            $ref: '#/components/schemas/SubservicePriceWrite'
          writeOnly: true
      required:
      - name
      - service_catalog
    ApiVersionResponse:
      type: object
      properties:
        version:
          type: string
      required:
      - version
    Asset:
      type: object
      description: Minimal read-only representation of a confirmed Asset.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssetStatusEnum'
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        content_type_client:
          type: string
          readOnly: true
        size_client:
          type: integer
          readOnly: true
          nullable: true
        is_temporary:
          type: boolean
          readOnly: true
        draft_token:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - confirmed_at
      - content_type_client
      - created_at
      - draft_token
      - id
      - is_temporary
      - kind
      - original_filename
      - size_client
      - status
      - uploaded_at
      - visibility
    AssetInitiateUpload:
      type: object
      description: |-
        Validate file metadata and issue a presigned S3 PUT URL for direct upload.

        Creates an Asset record in INITIATED status. The client must then:
          1. PUT the file to *upload_url*.
          2. POST to *complete_url* to confirm and move the file to its final location.
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 120
        size_bytes:
          type: integer
          minimum: 1
        draft_token:
          type: string
          default: ''
          maxLength: 64
      required:
      - content_type
      - filename
      - kind
      - size_bytes
    AssetStatusEnum:
      enum:
      - initiated
      - uploaded
      - confirmed
      - attached
      - orphan
      - rejected
      - deleted
      type: string
      description: |-
        * `initiated` - Initiated
        * `uploaded` - Uploaded
        * `confirmed` - Confirmed
        * `attached` - Attached
        * `orphan` - Orphan
        * `rejected` - Rejected
        * `deleted` - Deleted
    AssetUploadTarget:
      type: object
      description: Read-only serializer for the initiate-upload response.
      properties:
        asset_id:
          type: string
          format: uuid
          readOnly: true
        upload_url:
          type: string
          format: uri
          readOnly: true
        upload_method:
          type: string
          readOnly: true
        upload_headers:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        expires_in:
          type: integer
          readOnly: true
        complete_url:
          type: string
          format: uri
          readOnly: true
      required:
      - asset_id
      - complete_url
      - expires_in
      - upload_headers
      - upload_method
      - upload_url
    Category:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
      required:
      - name
      - uuid
    ChargingTypeEnum:
      enum:
      - per_day
      - per_hour
      - per_square_meter
      - per_project
      type: string
      description: |-
        * `per_day` - Per day
        * `per_hour` - Per hour
        * `per_square_meter` - Per square meter
        * `per_project` - Per project
    EmailTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Job:
      type: object
